name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/OpenCodeGoTray.exe package/
          Copy-Item README.md, README.ru.md, LICENSE, install.ps1, uninstall.ps1 package/
          Compress-Archive -Path package/* -DestinationPath "OpenCodeGoTray-${{ github.ref_name }}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: OpenCodeGoTray-*.zip
          generate_release_notes: true
