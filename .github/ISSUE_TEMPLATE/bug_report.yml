name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check that the issue is not already listed,
        and include the release version or commit you are running.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behaviour you saw, with exact error text if any.
      placeholder: The popup shows "HTTP 401" and the tray icon stays grey.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Windows version and display scaling
      placeholder: Windows 11 24H2, 2560×1440 at 125%
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Screenshots, OpenCode version, whether the badge is enabled, and whether the tray icon is visible or in the overflow menu.
    validations:
      required: false

